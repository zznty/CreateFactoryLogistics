plugins {
    id 'net.zznty.forgegradle' version '7.0.46' apply false
    id 'net.zznty.jarjar' version '0.2.3' apply false
}

allprojects {
    group = rootProject.mod_group_id
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
println "Version: ${version}"

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'net.zznty.forgegradle'
    apply plugin: 'maven-publish'

    if (project.name == "${rootProject.mod_id}-${minecraft_version}") {
        apply plugin: 'net.zznty.jarjar'
        jarJar.register { loader = forge_flavour }
        configurations.named('jarJarRuntimeElements') {
            outgoing.artifacts.clear()
            outgoing.artifact(tasks.named('jarJar')) { classifier = null }
        }
    }

    repositories {
        minecraft.mavenizer(it)
        maven fg.neoForgeMaven
        maven fg.minecraftLibsMaven
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://mvn.devos.one/snapshots" } // Registrate
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
        maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
        maven { url = "https://maven.liukrast.net/" } // extra gauges
        maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
        mavenCentral()
        maven { url 'https://modmaven.dev/' }
    }

    minecraft {
        mappings channel: 'parchment', version: "${mapping_version}-${minecraft_version}"
        runs {
            configureEach {
                workingDir.convention layout.projectDirectory.dir('run')
                systemProperty 'neoforge.logging.console.level', 'debug'
            }
            register('client') {}
            register('server') { args '--nogui' }
            register('data') {
                args '--all', '--mod', project.mod_id
                args '--output', layout.projectDirectory.dir('src/generated/resources').asFile.absolutePath
                args '--existing', layout.projectDirectory.dir('src/main/resources').asFile.absolutePath
            }
        }
    }

    dependencies {
        implementation minecraft.dependency("${forge_group_id}:${forge_flavour}:${forge_version}")

        compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
        compileOnly "mezz.jei:jei-${minecraft_version}-${forge_flavour}-api:${jei_version}"
        compileOnly "mezz.jei:jei-${minecraft_version}-${forge_flavour}:${jei_version}"
        runtimeOnly "mezz.jei:jei-${minecraft_version}-${forge_flavour}:${jei_version}"

        compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_tweaked_version}"
        compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}", {
            transitive = false
        }

        implementation "com.simibubi.create:create-${minecraft_version}:${create_version}:slim", { transitive = false }
        implementation "net.createmod.ponder:ponder-${forge_flavour}:${ponder_version}+mc${minecraft_version}"
        compileOnly "dev.engine-room.flywheel:flywheel-${forge_flavour}-api-${minecraft_version}:${flywheel_version}"
        runtimeOnly "dev.engine-room.flywheel:flywheel-${forge_flavour}-${minecraft_version}:${flywheel_version}"
        implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    }

    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                    'Specification-Title'     : project.mod_id,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : '1', // We are version 1 of ourselves
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Implementation-Vendor'   : mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                if (project.name == "${rootProject.mod_id}-${minecraft_version}") {
                    from components.jarJar
                    artifact tasks.named('sourcesJar')
                } else {
                    from components.java
                }
            }
        }

        repositories {
            maven {
                name = "zzntyMaven"
                url = "s3://dl.zznty.ru/maven"
                credentials(AwsCredentials) {
                    accessKey = providers.environmentVariable('S3_KEY_ID').getOrNull()
                    secretKey = providers.environmentVariable('S3_KEY').getOrNull()
                }
            }
        }
    }

    idea.module { downloadJavadoc = downloadSources = true }
}
