plugins {
    id 'me.modmuss50.mod-publish-plugin' version '0.8.+'
}

minecraft {
    accessTransformer = 'META-INF/accesstransformer.cfg'

    runs {
        register('gameTestServer') {
            args '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            mods {
                register(mod_id) {
                    sources sourceSets.main, sourceSets.test
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0")
    compileOnly "io.github.llamalad7:mixinextras-${forge_flavour}:0.5.0"
    jarJar("io.github.llamalad7:mixinextras-${forge_flavour}:0.5.0") {
        jarJar.configure(it) { range = '[0.5.0,)' }
    }

    implementation project(":create_factory_abstractions-${minecraft_version}")
    jarJar(project(":create_factory_abstractions-${minecraft_version}")) {
        jarJar.configure(it) {
            version = project.version.toString()
            range = "[${project.version},)"
        }
    }

    compileOnly "net.liukrast:deployer-${minecraft_version}:${deployer_version}", {
        transitive = false
    }

    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    implementation "mekanism:Mekanism:${mekanism_version}"

//    runtimeOnly "net.liukrast:extra_gauges-${minecraft_version}:${extra_gauges_version}", {
//        transitive = false
//    }

//    runtimeOnly "curse.maven:create-vibrant-vaults-1251719:6463890"
//    runtimeOnly "curse.maven:create-enchantment-industry-688768:6549319"
//    runtimeOnly "curse.maven:create-dragon-minus-1216624:6552025"

    runtimeOnly "org.squiddev:Cobalt:0.7.3"
    runtimeOnly "com.jcraft:jzlib:1.1.3"
    runtimeOnly "io.netty:netty-codec-http:4.1.82.Final"
    runtimeOnly "io.netty:netty-codec-socks:4.1.82.Final"
    runtimeOnly "io.netty:netty-handler-proxy:4.1.82.Final"

    runtimeOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range, forge_flavour: forge_flavour,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: version,
            mod_authors: mod_authors, mod_description: mod_description,
            create_version: create_version_requirement
    ]
    inputs.properties replaceProperties

    // NOTE: do not add `project` to the expand map: it drags the live Project into the task's
    // serialized inputs and breaks the configuration cache. No resource template references it.
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    if (forge_flavour != 'forge') {
        rename 'mods\\.toml', "${forge_flavour}.mods.toml"
    }
}

publishMods {
    file = tasks.named('jarJar').flatMap { it.archiveFile }
    changelog = rootProject.layout.projectDirectory.file('forge/CHANGELOG.md').asFile.exists() ?
            rootProject.layout.projectDirectory.file('forge/CHANGELOG.md').asFile.text : ''
    type = BETA
    displayName = "$mod_name $project.version"
    modLoaders.add(forge_flavour)

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1218807"
        minecraftVersions.add(minecraft_version)
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "QMGO17gm"
        minecraftVersions.add(minecraft_version)
    }

    dryRun = providers.environmentVariable("MODRINTH_TOKEN").getOrNull() == null
}

tasks.register('verifyJarJarMetadata') {
    dependsOn tasks.named('jarJar')
    inputs.file(tasks.named('jarJar').flatMap { it.archiveFile })

    doLast {
        def archive = tasks.named('jarJar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def metadataEntry = zip.getEntry('META-INF/jarjar/metadata.json')
            assert metadataEntry != null: 'Missing META-INF/jarjar/metadata.json'
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadataEntry))
            def expected = [
                    'create_factory_abstractions-1.21.1': project.version.toString(),
                    'mixinextras-neoforge'                  : '0.5.0'
            ]

            assert metadata.jars.size() == expected.size()
            expected.each { artifact, artifactVersion ->
                def nested = metadata.jars.find { it.identifier.group == (artifact.startsWith('create_factory') ? 'ru.zznty' : 'io.github.llamalad7') && it.identifier.artifact == artifact }
                assert nested != null: "Missing JarJar metadata for ${artifact}"
                assert nested.version.artifactVersion == artifactVersion
                assert nested.version.range == "[${artifactVersion},)"
                assert nested.path.startsWith('META-INF/jarjar/')
                assert zip.getEntry(nested.path) != null: "Missing nested jar ${nested.path}"
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyJarJarMetadata') }
