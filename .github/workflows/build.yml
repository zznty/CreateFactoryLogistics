name: Build
on:
  push:
    branches:
      - master
      - '1.21'
  pull_request:
    branches:
      - master
      - '1.21'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag prefix
        id: tag-prefix
        shell: pwsh
        run: |
          $branch = '1.20.1'
          if ('${{ github.ref }}' -eq 'refs/heads/1.21') {
            $branch = '1.21.1'
          }
          Write-Output "prefix=$branch" >> $env:GITHUB_OUTPUT

      - id: version
        uses: paulhatch/semantic-version@v5.3.0
        with:
          tag_prefix: '${{ steps.tag-prefix.outputs.prefix }}-'
          major_pattern: '/\w+(?:\([\w.]+\))?!?:.+/'
          minor_pattern: '/feat(?:\([\w.]+\))?:.+/'

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew -Pversion=${{ steps.version.outputs.version }} --no-daemon :create_factory_logistics-1.21.1:assemble

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: create-factory-logistics
          path: forge/build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 3

  gametests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile GameTests
        run: ./gradlew :create_factory_logistics-1.21.1:testClasses --no-daemon

      - name: Run GameTests
        run: ./gradlew :create_factory_logistics-1.21.1:runGameTestServer --no-daemon

      - name: Upload GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: forge/run/logs
          if-no-files-found: ignore
